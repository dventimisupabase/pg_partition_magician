x-pg-base: &pg-base
  environment:
    POSTGRES_DB: postgres
    POSTGRES_USER: postgres
    POSTGRES_PASSWORD: postgres
  # default /dev/shm is 64MB; too small for parallel scans/VACUUM on a large
  # bench table (managed instances have ample shm, this only matters in Docker)
  shm_size: "1gb"
  # mount the repo read-only so the harness can psql -f the source, the
  # migrations (fixtures), built bundles, and pg_prove the tests.
  volumes:
    - .:/repo:ro
  healthcheck:
    test: ["CMD-SHELL", "pg_isready -U postgres"]
    interval: 5s
    timeout: 5s
    retries: 10

services:
  postgres15:
    <<: *pg-base
    profiles: ["pg15", "all"]
    build: { context: ., args: { PG_VERSION: 15 } }
    image: pgpm_test:15
    container_name: pgpm_test-15
    ports: ["5515:5432"]

  postgres16:
    <<: *pg-base
    profiles: ["pg16", "all"]
    build: { context: ., args: { PG_VERSION: 16 } }
    image: pgpm_test:16
    container_name: pgpm_test-16
    ports: ["5516:5432"]

  postgres17:
    <<: *pg-base
    profiles: ["pg17", "all"]
    build: { context: ., args: { PG_VERSION: 17 } }
    image: pgpm_test:17
    container_name: pgpm_test-17
    ports: ["5517:5432"]

  postgres18:
    <<: *pg-base
    profiles: ["pg18", "all"]
    build: { context: ., args: { PG_VERSION: 18 } }
    image: pgpm_test:18
    container_name: pgpm_test-18
    ports: ["5518:5432"]

  # The from_hypertable track: PG15 + Apache TimescaleDB, on the Supabase fleet image
  # (public.ecr.aws/supabase/postgres). That is the edition the migration actually targets, and it ships
  # timescaledb (Apache), pgTAP, and the timescaledb shared_preload preloaded -- so no build step is needed.
  # TS_PG_TAG (set by `./test.sh timescale`) selects the image tag; default 15.14.1.127 bundles TimescaleDB
  # 2.16.1. Excluded from the default 15/16/17/18 matrix (its own profile, never "all").
  timescale:
    <<: *pg-base
    profiles: ["timescale"]
    image: public.ecr.aws/supabase/postgres:${TS_PG_TAG:-15.14.1.127}
    container_name: pgpm_test-timescale
    # Override pg-base's environment: the supabase/postgres image bootstraps its own superuser
    # (supabase_admin) and a postgres role, and its first-boot migrate.sh connects AS supabase_admin --
    # so setting POSTGRES_USER=postgres (as pg-base does) makes that role the superuser instead, and
    # migrate.sh fails ("role supabase_admin does not exist") and the container exits. Pass only the
    # password; the image still creates the `postgres` role the harness connects with.
    environment:
      POSTGRES_PASSWORD: postgres
    ports: ["5519:5432"]

  # The archive track: PG17 + pgsql-http (S3 uploads via the http extension) + MinIO standing in
  # for S3. Its own profile, excluded from "all" -- pgsql-http is only needed here, so the default
  # pg15-18 matrix images stay exactly as they were. test.sh's own one-off `docker run --network`
  # calls (the health wait and the SigV4-signed bucket setup, both plain curl) rely on the network
  # name pinned below rather than guessing Compose's auto-generated one.
  #
  # Which image, and why it is pinned by digest (issue #436). MinIO stopped publishing public images:
  # Docker Hub's minio/minio went "pull access denied" on 2026-09-13 (PR #373 moved to quay.io), and on
  # 2026-09-24 quay.io/minio/minio started answering `unauthorized` too, its API returning 401 for the
  # repository itself, so no MinIO-published registry serves it anonymously any more. That was verified
  # at the registry level with an anonymous bearer token, NOT with `docker manifest inspect`, which on
  # the Mac that found this failed for every image, alpine included. bitnamilegacy/minio is Bitnami's
  # frozen (2025-08-19, unmaintained by design) build of MinIO 2025.7.23; it pulls anonymously from
  # Docker Hub, ships linux/amd64 and linux/arm64, and is exactly what a test double wants: an S3 API
  # that never changes underneath the suite. The digest is the multi-arch index, so the runner and a
  # Mac get the same bytes, and a deleted image fails the pull loudly instead of a retagged one silently
  # pulling something else.
  #
  # No `command:`: this image's entrypoint starts the server itself (data under /bitnami/minio/data,
  # as uid 1001) and honours MINIO_ROOT_USER / MINIO_ROOT_PASSWORD, so tests/archive/fixtures.sql's
  # endpoint and credentials are unchanged. The bucket is created by test.sh with a SigV4-signed curl
  # PUT rather than the `mc` client, whose image vanished with the server's; that keeps the setup
  # image-agnostic, so a future swap of this service is a one-line change here.
  minio:
    profiles: ["archive"]
    image: bitnamilegacy/minio:2025.7.23-debian-12-r5@sha256:6dabb4a2088c9a79908de3bc05f4586c23ad2182c8908e7e3acbf61c1467fb20
    container_name: pgpm_test-archive-minio
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin

  archive:
    <<: *pg-base
    profiles: ["archive"]
    build: { context: ., args: { PG_VERSION: 17, WITH_PGSQL_HTTP: "true" } }
    image: pgpm_test:17-archive
    container_name: pgpm_test-archive
    ports: ["5520:5432"]

  # The locktrace track (issue #383): PG17 plus eBPF lock observation via bench/lock_probe.py, which
  # attaches uprobes to the running postgres binary and reports lock acquisitions and commits as they
  # happen -- continuous observation, where every other lock guard in bench/ infers a lock's lifetime
  # from whether a concurrent reader timed out. Its own profile, excluded from "all": the image
  # carries bcc and debug symbols that nothing else needs, and the service is PRIVILEGED, which no
  # other service here is.
  #
  # Why privileged, and why the three host mounts. BCC compiles its BPF program at run time against the
  # HOST kernel's headers and then loads it, so the container needs /lib/modules and /usr/src from the
  # host (the kernel it traces is the host's, not the image's) and /sys/kernel/debug for the uprobe
  # machinery. Loading a BPF program and attaching uprobes both need capabilities a default container
  # does not have. This is also exactly why the track is CI-and-Linux-only and never a pre-push
  # expectation: Docker Desktop for Mac's linuxkit VM publishes no headers for its own kernel, so BCC
  # cannot compile there at all (confirmed structurally on #383, not a missing package).
  #
  # The tracer runs INSIDE this container, alongside the server it traces, so it shares the server's PID
  # namespace and resolves the same /usr/lib/postgresql/17/bin/postgres it probes.
  locktrace:
    <<: *pg-base
    profiles: ["locktrace"]
    build: { context: ., args: { PG_VERSION: 17, WITH_LOCK_TRACER: "true" } }
    image: pgpm_test:17-locktrace
    container_name: pgpm_test-locktrace
    privileged: true
    # Overrides pg-base's single repo mount rather than adding to it: a nested `volumes:` key REPLACES
    # the anchor's list outright, so /repo has to be repeated here or the harness cannot psql -f the
    # source. /sys/kernel/debug is read-write on purpose (the tracer writes to the uprobe_events
    # interface under it); the other two are read-only.
    volumes:
      - .:/repo:ro
      - /lib/modules:/lib/modules:ro
      - /usr/src:/usr/src:ro
      - /sys/kernel/debug:/sys/kernel/debug
    ports: ["5521:5432"]

networks:
  default:
    name: pgpm_test_net
