name: Perf guard

# Guards regrain and transmute against DATA-COUPLED LOCKS AND WORK: a blocking lock may last milliseconds, but it must never last
# a duration coupled to data size (issue #263's acceptance rule).
#
# Separate from the pgTAP matrix for two reasons. The lock guards need a SECOND SESSION observing a first
# one mid-operation, and a pgTAP file is one session. The work guards read pg_stat_all_tables scan
# counters, which flush at TRANSACTION END, so the sample has to be taken in a later transaction than the
# work it measures; the harness runs one tick per transaction, which is also how maintain drives it in
# production.
#
# It asserts scan COUNTERS, not wall-clock, so there are no timing thresholds to flake on a shared runner:
# the expected value is exactly zero.
on:
  push:
    branches: [ main ]
    paths:
      - 'pgpm_core/install.sql'
      # Matched by SHAPE, not enumerated. Every guard this job runs -- through `./test.sh perf` and
      # through the `discriminate` step that drives the archive guards too -- is a bench/*.sh, and an
      # enumerated list silently stops covering the next one added. It already had: four guards the
      # perf track runs (transmute_cutover_order, upgrade_in_place, frontier_drought,
      # regrain_outgoing_fk_lock) sat outside the list, so changing one of them on its own ran no
      # perf job at all. Found while fixing #417, which is the same defect one level down -- a
      # hand-maintained list of what to check, drifting behind what exists, with nothing reporting it.
      # This sweeps in a few bench scripts the job does not run; a job that runs when it need not is
      # cheap, and one that quietly does not run is what this repo keeps paying for.
      - 'bench/*.sh'
      - 'bench/mutations/**'
      - 'tests/77_retain_incoming_fk_test.sql'   # the file retire_detach_substitution.sh drives
      - 'tests/107_regrain_swap_reconcile_complete_test.sql'   # the file regrain_swap_reconcile.sh drives
      - 'tests/111_grid_timezone_test.sql'       # the file grid_timezone.sh drives
      - 'test.sh'
      - 'docker-compose.yml'
      - 'Dockerfile'
      - '.github/workflows/perf.yml'
  pull_request:
    branches: [ main ]
    paths:
      - 'pgpm_core/install.sql'
      # Matched by SHAPE, not enumerated. Every guard this job runs -- through `./test.sh perf` and
      # through the `discriminate` step that drives the archive guards too -- is a bench/*.sh, and an
      # enumerated list silently stops covering the next one added. It already had: four guards the
      # perf track runs (transmute_cutover_order, upgrade_in_place, frontier_drought,
      # regrain_outgoing_fk_lock) sat outside the list, so changing one of them on its own ran no
      # perf job at all. Found while fixing #417, which is the same defect one level down -- a
      # hand-maintained list of what to check, drifting behind what exists, with nothing reporting it.
      # This sweeps in a few bench scripts the job does not run; a job that runs when it need not is
      # cheap, and one that quietly does not run is what this repo keeps paying for.
      - 'bench/*.sh'
      - 'bench/mutations/**'
      - 'tests/77_retain_incoming_fk_test.sql'   # the file retire_detach_substitution.sh drives
      - 'tests/107_regrain_swap_reconcile_complete_test.sql'   # the file regrain_swap_reconcile.sh drives
      - 'tests/111_grid_timezone_test.sql'       # the file grid_timezone.sh drives
      - 'test.sh'
      - 'docker-compose.yml'
      - 'Dockerfile'
      - '.github/workflows/perf.yml'
  workflow_dispatch:

# Sharded across runners. One job that ran every guard and then every mutation took 27 minutes and was
# the critical path of every PR's CI (the pgTAP matrix takes 6). `--shard=I/N` is an interleaved slice
# of the same list, chosen by index, so every guard and every mutation runs in exactly one job and no
# guard's environment changes: each still gets its own runner, container and database. A slice that
# would select nothing FAILS rather than passing vacuously (test.sh and bench/discriminate.sh both
# enforce it), so mis-sizing N can only make a job red, never quietly skip a guard.
#
# `./test.sh perf` and `./test.sh discriminate` with no --shard still run everything, which is what
# `./test.sh ci` does locally.
jobs:
  perf:
    name: ${{ matrix.track }} ${{ matrix.shard }} / PG17
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          # data-coupled lock and work guards on correct code
          - { track: perf, shard: 1/3 }
          - { track: perf, shard: 2/3 }
          - { track: perf, shard: 3/3 }
          # Every guard is green on correct code. That alone does not show any of them would notice a
          # regression, and this repo has repeatedly produced guards that pass while observing nothing.
          # These rebuild install.sql with each defect put back and require the matching guard to FAIL.
          - { track: discriminate, shard: 1/4 }
          - { track: discriminate, shard: 2/4 }
          - { track: discriminate, shard: 3/4 }
          - { track: discriminate, shard: 4/4 }
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Run ${{ matrix.track }} shard ${{ matrix.shard }}
        run: ./test.sh ${{ matrix.track }} --shard=${{ matrix.shard }}
