name: Observe track

# pgpm_core's pg_flight_recorder (PGFR) correlation functions (impact_report/feathering_validation),
# verified against a real PGFR install. Separate from the main matrix because it vendors PGFR
# (bench/vendor/) alongside pgpm; the PGFR-absent gate is a plain test in the main suite instead
# (tests/65_observe_no_pgfr_test.sql). PG15 only and PGFR needs only pg_cron, so it runs on the stock
# pgpm_test:15 image (built by compose). Path-filtered so it runs only when the core, its tests, the
# harness, or the vendored PGFR change.
on:
  push:
    branches: [ main ]
    paths:
      - 'pgpm_core/install.sql'
      - 'tests/observe/**'
      - 'bench/vendor/pg_flight_recorder/**'
      - 'test.sh'
      - 'docker-compose.yml'
      - 'Dockerfile'
      - '.github/workflows/observe.yml'
  pull_request:
    branches: [ main ]
    paths:
      - 'pgpm_core/install.sql'
      - 'tests/observe/**'
      - 'bench/vendor/pg_flight_recorder/**'
      - 'test.sh'
      - 'docker-compose.yml'
      - 'Dockerfile'
      - '.github/workflows/observe.yml'
  workflow_dispatch:

jobs:
  observe:
    name: pg_flight_recorder correlation / PG15
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Run the observe track
        run: ./test.sh observe
