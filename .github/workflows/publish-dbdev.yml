name: Publish to database.dev

on:
  workflow_call:
    inputs:
      version:
        description: 'Version tag (e.g. v0.1.0)'
        required: true
        type: string
    secrets:
      DBDEV_TOKEN:
        required: true
  workflow_dispatch:
    inputs:
      version:
        description: 'Version tag (e.g. v0.1.0)'
        required: true
        type: string

# Requires a database.dev account and a DBDEV_TOKEN repo secret (see README).
# Inert until those exist; no-ops can't run without a tag/dispatch.
jobs:
  publish:
    name: dbdev publish
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - id: v
        name: Normalize version (dbdev requires x.y.z)
        run: |
          RAW="${{ inputs.version }}"; VER="${RAW#v}"
          if [[ "$VER" =~ ^[0-9]+\.[0-9]+$ ]]; then VER="${VER}.0"; fi
          echo "version=$VER" >> "$GITHUB_OUTPUT"

      - name: Build the dbdev package
        run: |
          VER="${{ steps.v.outputs.version }}"
          mkdir -p dbdev-pkg
          # Minified single-file extension SQL (CREATE EXTENSION runs server-side,
          # so no psql metacommands; under dbdev's 250k-char cap).
          scripts/build_dbdev_package.sh pgpm_core/install.sql "dbdev-pkg/pg_partition_magician--${VER}.sql"
          # dbdev expects <name>.control + <name>--<ver>.sql + a README.md
          # (used as the package's docs on database.dev) in the publish directory.
          cp pgpm_core/extension.control dbdev-pkg/pg_partition_magician.control
          sed -i "s/^default_version = .*/default_version = '${VER}'/" dbdev-pkg/pg_partition_magician.control
          cp README.md dbdev-pkg/README.md
          SIZE=$(wc -c < "dbdev-pkg/pg_partition_magician--${VER}.sql")
          echo "package size: ${SIZE} chars"
          [ "$SIZE" -le 250000 ] || { echo "exceeds dbdev 250,000-char cap"; exit 1; }

      - name: Install the dbdev CLI
        env:
          # Pinned deliberately (issue #406) -- resolving releases/latest at run time let an upstream
          # compromise hand this job's live DBDEV_TOKEN to an unverified binary. Bump the version and
          # checksum together, as their own reviewed change, when supabase/dbdev needs to move forward.
          # The checksum is the sha256 GitHub itself reports for the asset (via the Releases API's
          # `digest` field), not anything supabase/dbdev's own release process asserts.
          DBDEV_CLI_VERSION: v0.1.7
          DBDEV_CLI_SHA256: d3aca68584f402c2192d2946acdd081a189851505be38ceaee6418340a335b11
        run: |
          DEB_URL="https://github.com/supabase/dbdev/releases/download/${DBDEV_CLI_VERSION}/dbdev-${DBDEV_CLI_VERSION}-linux-amd64.deb"
          curl -fsSL -o dbdev.deb "$DEB_URL"
          echo "${DBDEV_CLI_SHA256}  dbdev.deb" | sha256sum -c -
          sudo dpkg -i dbdev.deb

      - name: Authenticate to dbdev
        env:
          DBDEV_TOKEN: ${{ secrets.DBDEV_TOKEN }}
        run: |
          mkdir -p ~/.dbdev
          printf '[registries.dbdev]\ntoken = "%s"\n' "$DBDEV_TOKEN" > ~/.dbdev/credentials.toml

      - name: Publish
        run: cd dbdev-pkg && dbdev publish
