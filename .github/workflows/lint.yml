name: Lint

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  markdown-lint:
    name: Markdown
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: DavidAnson/markdownlint-cli2-action@v16
        with:
          # Exclude the verbatim ChatGPT-authored design doc -- it's a kept
          # artifact, not our authored prose, so we don't reformat it.
          globs: |
            **/*.md
            !frozen/postgresql_online_partition_migration_summary.md

  living-docs:
    name: Living docs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Living documentation must be true, and must not cite frozen artifacts
        run: bash scripts/check_living_docs.sh

  quoted-splices:
    name: Quoted splices
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # scripts/check_quoted_splices.py keeps the `_q` marker honest in both directions: an
      # already-quoted fragment must carry it, and a name that carries it must have earned it
      # (#409). Its --selftest runs FIRST and on its own embedded fixtures, so a parser that has
      # stopped matching this module fails here rather than reporting a clean sweep of nothing.
      # No dependencies, no database, no container: it reads the three install.sql files.
      - name: The _q marker must be true in both directions
        run: |
          python3 scripts/check_quoted_splices.py --selftest
          python3 scripts/check_quoted_splices.py

  minifier:
    name: dbdev minifier
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # The dbdev package is the one artifact an operator installs that is NOT byte-for-byte the
      # reviewed install.sql, and the minifier that makes it used to decide "is this line a
      # comment" from the line's own leading characters, with no idea whether it sat inside a
      # string literal (#410). Its --selftest carries a port of that old logic and requires each
      # fixture to come out differently under it, so a rewrite that quietly reintroduced the
      # blindness fails here. Then build the real package, which also re-checks that the file
      # lexes end to end (unbalanced quote or dollar tag = a loud error, not a silent minify).
      - name: The minifier must know where a line sits before deciding what it is
        run: |
          python3 scripts/minify_sql.py --selftest
          scripts/build_dbdev_package.sh pgpm_core/install.sql dist/minifier-check.sql

  track-filters:
    name: Track path filters
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # A workflow's `paths:` filter is a hand-maintained list of what it watches, and it drifts
      # behind what the track it runs actually invokes. The drift is invisible in the worst way:
      # the job does not fail, it does not RUN, and a PR that changed only the guard it gates
      # merges green with nothing having looked at it. Three instances were found by hand in one
      # afternoon (#419, #423, #424); this checks the class instead. --selftest runs FIRST, on
      # embedded fixtures, so a parser that has stopped reading test.sh fails here rather than
      # reporting a clean sweep of nothing. No dependencies, no database, no container.
      - name: Every file a track runs must be in its workflow's path filter
        run: |
          python3 scripts/check_track_filters.py --selftest
          python3 scripts/check_track_filters.py

  shellcheck:
    name: Shell scripts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ludeeus/action-shellcheck@master
        with:
          scandir: '.'
          severity: warning

  lock-view-selftest:
    name: Lock-view self-test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # bench/lock_view_selftest.py covers the lock-sequence renderer's asserting half: the four
      # refusals, the relation fold, the mode tiers, the wait-span threshold and the producer
      # semantics. It lives here rather than in test.yml's matrix because it needs no container, no
      # database and no eBPF -- only matplotlib and the committed golden fixture -- so it runs in
      # seconds beside the other cheap checks instead of behind a five-minute Postgres start-up.
      #
      # The eBPF capture itself (bench/lock_view.py) is deliberately NOT covered here: it needs a
      # privileged container and the host's own kernel headers, which is what locktrace.yml exists
      # for. Green here means the renderer's assertions hold, not that the probe attached.
      #
      # A venv rather than a bare `pip install`: the runner's python may be PEP 668
      # externally-managed, in which case installing into it is refused. A venv is correct either
      # way and costs a couple of seconds.
      - name: Run the lock-view self-test
        run: |
          python3 -m venv .venv-lockview
          .venv-lockview/bin/pip install --quiet matplotlib
          .venv-lockview/bin/python bench/lock_view_selftest.py

  sql-syntax:
    name: SQL unterminated-block check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check dollar-quote / comment balance in the module
        run: |
          awk '
            /\$\$/ { n=gsub(/\$\$/,"&"); dq += n }
            END {
              if (dq % 2 != 0) { print "Unbalanced $$ dollar quotes"; exit 1 }
              print "dollar-quote check passed"
            }
          ' pgpm_core/install.sql
